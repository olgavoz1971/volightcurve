[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "volightcurve"
version = "0.1.0"
description = "IVOA-oriented lightcurve I/O and photometric calibration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "Olga Vozyakova", email = "olgavoz@gmail.com"}]
dependencies = [
    "numpy",
    "astropy",
]

[project.optional-dependencies]
# Reading a VOTable (``read_lightcurve``) needs the GAVO VOTable stack. Writing does not.
read = [
    # GAVO imports OpenSSL at package load (gavo.utils.monkeypatch).
    "pyOpenSSL",
    # GAVO VOTable stack:
    "gavoutils @ https://soft.g-vo.org/dist/gavoutils-latest.tar.gz",
    "gavostc @ https://soft.g-vo.org/dist/gavostc-latest.tar.gz",
    "gavovot @ https://soft.g-vo.org/dist/gavovot-latest.tar.gz",
]
dev = ["pytest", "matplotlib", "volightcurve[read]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
